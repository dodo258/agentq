e="12.5" fill="#B5690F" text-anchor="end">sent back</text><rect x="250" y="270" width="200" height="124" rx="8" fill="none" stroke="#DAD3C4"/><text x="266" y="299" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif" font-size="15" font-weight="600" fill="#16181D">Your call</text><text x="266" y="324" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" fill="#6A665C">Still failing, or can't tell</text><text x="266" y="345" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" fill="#6A665C">Telegram card (optional)</text><text x="266" y="366" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" fill="#6A665C">agentq gate pass</text><line x1="500" y1="332" x2="452" y2="332" stroke="#B5690F" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#am)"/></svg>
