<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 432" width="1000" height="432"><defs><marker id="an" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0.8 L7,4 L0,7.2" fill="none" stroke="#9C988D" stroke-width="1.3"/></marker><marker id="am" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0.8 L7,4 L0,7.2" fill="none" stroke="#F0A13A" stroke-width="1.3"/></marker></defs><rect x="0" y="20" width="200" height="124" rx="8" fill="none" stroke="#30333B"/><text x="16" y="49" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif" font-size="15" font-weight="600" fill="#EDE6D8">你说一句</text><text x="16" y="74" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" fill="#9C988D">Claude Code 会话</text><text x="16" y="95" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" fill="#9C988D">Telegram</text><text x="16" y="116" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" fill="#9C988D">命令行 agentq add</text><rect x="250" y="20" width="200" height="124" rx="8" fill="none" stroke="#30333B"/><text x="266" y="49" font-family="'SF Mono','SFMono-Regular',Menlo,'PingFang SC',monospace" font-size="15" font-weight="600" fill="#EDE6D8">docs/BACKLOG.md</text><text x="266" y="74" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" fill="#9C988D">每个项目一份</text><text x="266" y="95" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" fill="#9C988D">从上往下做</text><text x="266" y="116" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" fill="#9C988D">随仓库提交</text><rect x="500" y="20" width="210" height="124" rx="8" fill="#1E2128" stroke="#F0A13A"/><text x="516" y="49" font-family="'SF Mono','SFMono-Regular',Menlo,'PingFang SC',monospace" font-size="15" font-weight="600" fill="#EDE6D8">agentq tick</text><text x="516" y="74" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" fill="#9C988D">每 5 分钟，任务结束时也跑</text><text x="516" y="95" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" fill="#9C988D">暂停、额度、熔断</text><text x="516" y="116" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" fill="#9C988D">并发、登录</text><rect x="760" y="20" width="240" height="124" rx="8" fill="none" stroke="#30333B"/><text x="776" y="49" font-family="'SF Mono','SFMono-Regular',Menlo,'PingFang SC',monospace" font-size="15" font-weight="600" fill="#EDE6D8">claude -p</text><text x="776" y="74" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" fill="#9C988D">独立进程，独立 worktree</text><text x="776" y="95" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" fill="#9C988D">认领、实现、自测</text><text x="776" y="116" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" fill="#9C988D">写 ready.json 就退出</text><line x1="200" y1="82" x2="248" y2="82" stroke="#9C988D" stroke-width="1.4" marker-end="url(#an)"/><line x1="450" y1="82" x2="498" y2="82" stroke="#9C988D" stroke-width="1.4" marker-end="url(#an)"/><line x1="710" y1="82" x2="758" y2="82" stroke="#9C988D" stroke-width="1.4" marker-end="url(#an)"/><rect x="760" y="270" width="240" height="124" rx="8" fill="none" stroke="#30333B"/><text x="776" y="299" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif" font-size="15" font-weight="600" fill="#EDE6D8">过门</text><text x="776" y="324" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" fill="#9C988D">合并态上跑 .agentq/verify</text><text x="776" y="345" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" fill="#9C988D">另开进程审查</text><text x="776" y="366" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" fill="#9C988D">都过了，引擎合到 main</text><rect x="500" y="270" width="210" height="124" rx="8" fill="none" stroke="#30333B"/><text x="516" y="299" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif" font-size="15" font-weight="600" fill="#EDE6D8">收尾，告诉你</text><text x="516" y="324" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" fill="#9C988D">当天汇总和早报</text><text x="516" y="345" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" fill="#9C988D">Telegram（可选）</text><text x="516" y="366" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" fill="#9C988D">agentq status</text><line x1="880" y1="144" x2="880" y2="268" stroke="#9C988D" stroke-width="1.4" marker-end="url(#an)"/><line x1="760" y1="332" x2="712" y2="332" stroke="#9C988D" stroke-width="1.4" marker-end="url(#an)"/><text x="870" y="250" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif" font-size="12.5" fill="#9C988D" text-anchor="end">ready.json</text><path d="M 840 144 C 840 196, 760 196, 610 146" fill="none" stroke="#F0A13A" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#am)"/><text x="640" y="216" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif" font-size="12.5" fill="#F0A13A" text-anchor="middle">中断、撞上限：同一会话续跑</text><path d="M 960 270 V 146" fill="none" stroke="#F0A13A" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#am)"/><text x="952" y="200" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif" font-size="12.5" fill="#F0A13A" text-anchor="end">门没过：</text><text x="952" y="218" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif" font-size="12.5" fill="#F0A13A" text-anchor="end">退回接着改</text><rect x="250" y="270" width="200" height="124" rx="8" fill="none" stroke="#30333B"/><text x="266" y="299" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif" font-size="15" font-weight="600" fill="#EDE6D8">等你定</text><text x="266" y="324" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" fill="#9C988D">还不过、判不了</text><text x="266" y="345" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" fill="#9C988D">Telegram 卡片（可选）</text><text x="266" y="366" font-family="-apple-system,'PingFang SC','Helvetica Neue',sans-serif" font-size="13" fill="#9C988D">agentq gate pass</text><line x1="500" y1="332" x2="452" y2="332" stroke="#F0A13A" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#am)"/></svg>
